version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:iFBtXEEByjjIyQKgnrHojzN4jM7p+77CsX6ymMzBW6o"
      - run:
          name: Deploy to EC2
          command: |
            ssh -o StrictHostKeyChecking=accept-new \
              "${EC2_USERNAME}@${EC2_PUBLIC_DNS}" \
              'cd ~/ExampleApplication && git pull origin main && bash deploy.sh'

workflows:
  build-workflow:
    jobs:
      - build:
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main
